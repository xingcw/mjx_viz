<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mjx_viz Dashboard</title>
<style>
  :root {
    --sidebar-w: 280px;
    --bg: #0f1117;
    --surface: #181b24;
    --surface-hover: #1f2330;
    --border: #2a2e3a;
    --text: #e0e0e6;
    --text-dim: #8b8fa3;
    --accent: #6c8cff;
    --accent-dim: #3d5299;
    --green: #4caf82;
    --badge: #ff6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
         background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  /* Layout */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr;
         grid-template-rows: 48px 1fr; height: 100vh; }
  /* Fullscreen mode: hide header, sidebar, and toolbar so the iframe owns the entire viewport. */
  .app.fullscreen { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .app.fullscreen .header,
  .app.fullscreen .sidebar,
  .app.fullscreen .toolbar { display: none; }
  .header { grid-column: 1 / -1; display: flex; align-items: center;
            padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
            gap: 12px; }
  .header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
  .header button { background: var(--bg); border: 1px solid var(--border);
                   color: var(--text-dim); font-size: 11px; padding: 4px 10px;
                   border-radius: 4px; cursor: pointer; font-family: inherit; }
  .header button:hover { color: var(--text); border-color: var(--accent-dim); }
  /* Floating "exit fullscreen" button only visible in fullscreen mode. */
  .exit-fs { position: fixed; top: 12px; right: 12px; z-index: 10;
             background: rgba(24,27,36,0.85); color: var(--text);
             border: 1px solid var(--border); border-radius: 4px;
             padding: 6px 12px; font-size: 11px; cursor: pointer;
             font-family: inherit; display: none; }
  .app.fullscreen .exit-fs { display: block; }
  .exit-fs:hover { border-color: var(--accent); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--text-dim); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--badge); }
  .status-dot.live { background: var(--green); }

  /* Sidebar */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border);
             overflow-y: auto; padding: 8px 0; position: relative; }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .sidebar-resize { position: absolute; top: 0; right: -3px; width: 6px; height: 100%;
                    cursor: col-resize; z-index: 20; }
  .sidebar-resize:hover, .sidebar-resize.dragging { background: var(--accent); opacity: 0.5; }
  .run-group { margin-bottom: 4px; }
  .run-header { display: flex; align-items: center; padding: 8px 12px; cursor: pointer;
                font-size: 13px; font-weight: 600; color: var(--text-dim);
                transition: background 0.15s; user-select: none; gap: 6px; }
  .run-header:hover { background: var(--surface-hover); color: var(--text); }
  .run-header.active { color: var(--accent); }
  .run-header .arrow { font-size: 10px; transition: transform 0.2s; width: 12px; }
  .run-header .arrow.open { transform: rotate(90deg); }
  .run-header .count { margin-left: auto; font-size: 11px; font-weight: 400;
                       background: var(--border); padding: 1px 6px; border-radius: 8px; }
  .run-header .badge-new { margin-left: 4px; font-size: 10px; font-weight: 700;
                           color: var(--badge); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .step-list { display: none; }
  .step-list.open { display: block; }
  .step-item { padding: 6px 12px 6px 30px; font-size: 12px; cursor: pointer;
               color: var(--text-dim); transition: all 0.15s; }
  .step-item:hover { background: var(--surface-hover); color: var(--text); }
  .step-item.active { color: var(--accent); background: rgba(108, 140, 255, 0.08); }
  .step-item .step-label { font-family: monospace; }

  /* Main content */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { display: flex; align-items: center; padding: 8px 16px;
             background: var(--surface); border-bottom: 1px solid var(--border);
             gap: 8px; flex-wrap: wrap; min-height: 44px; }
  .toolbar .breadcrumb { font-size: 12px; color: var(--text-dim); }
  .toolbar .breadcrumb span { color: var(--text); }
  .episode-tabs { display: flex; gap: 4px; margin-left: 16px; flex-wrap: wrap; }
  .episode-tab { padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;
                 background: var(--bg); border: 1px solid var(--border); color: var(--text-dim);
                 transition: all 0.15s; font-family: monospace; }
  .episode-tab:hover { border-color: var(--accent-dim); color: var(--text); }
  .episode-tab.active { background: var(--accent-dim); border-color: var(--accent);
                        color: #fff; }

  /* View-mode toggle: brax 3D viewer ↔ trajectory plots ↔ training curves
     ↔ per-run config.json ↔ per-run log.txt. */
  .view-toggle { display: inline-flex; gap: 0; margin-left: auto; }
  .view-toggle button { background: var(--bg); border: 1px solid var(--border);
                        color: var(--text-dim); font-size: 11px; padding: 4px 10px;
                        cursor: pointer; font-family: monospace; border-left: none; }
  .view-toggle button:first-child { border-radius: 4px 0 0 4px; border-left: 1px solid var(--border); }
  .view-toggle button:last-child { border-radius: 0 4px 4px 0; }
  .view-toggle button.active { background: var(--accent-dim); border-color: var(--accent);
                               color: #fff; }
  .view-toggle button:hover:not(.active) { color: var(--text); }
  .view-toggle button[hidden] { display: none; }

  /* "final" rollout marker: post-training run, surfaced in the step list. */
  .step-item.final-step .step-label::before { content: "★ "; color: var(--green); }

  .viewer { flex: 1; position: relative; background: var(--bg); }
  .viewer iframe { width: 100%; height: 100%; border: none; }
  .viewer pre.text-view { width: 100%; height: 100%; margin: 0; padding: 16px;
                           background: var(--bg); color: var(--text);
                           font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                           font-size: 12px; line-height: 1.5; overflow: auto;
                           white-space: pre-wrap; word-break: break-word;
                           box-sizing: border-box; }
  .viewer .empty { position: absolute; inset: 0; display: flex; align-items: center;
                   justify-content: center; color: var(--text-dim); font-size: 14px;
                   flex-direction: column; gap: 8px; }
  .viewer .empty .hint { font-size: 12px; }
  .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
             color: var(--text-dim); font-size: 13px; display: none; }
  .loading.show { display: block; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <h1>GO2 TRAINING DASHBOARD</h1>
    <button id="fullscreenBtn" title="Hide sidebar/toolbar (or press F)">Fullscreen</button>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </div>
  <button class="exit-fs" id="exitFsBtn" title="Press F or Esc to exit">Exit fullscreen</button>

  <div class="sidebar" id="sidebar">
    <div style="padding: 12px; color: var(--text-dim); font-size: 12px;">Loading runs...</div>
    <div class="sidebar-resize" id="sidebarResize"></div>
  </div>

  <div class="main">
    <div class="toolbar" id="toolbar">
      <div class="breadcrumb" id="breadcrumb">Select a run and step from the sidebar</div>
      <div class="episode-tabs" id="episodeTabs"></div>
      <div class="view-toggle" id="viewToggle">
        <button data-view="3d" class="active" title="Brax 3D viewer">3D View</button>
        <button data-view="traj" title="Plotly per-step trajectory plots (actions, thrust, pos, vel, ω, rewards, gate b-frame…)">Plots</button>
        <button data-view="training" title="Per-eval training curves for the selected run (losses, KL, ep length, gate stats…)">Training</button>
        <button data-view="config" id="viewConfigBtn" hidden title="Per-run config.json (full CLI args + env config)">Config</button>
        <button data-view="log" id="viewLogBtn" hidden title="Per-run log.txt (last 2000 lines)">Log</button>
      </div>
    </div>
    <div class="viewer" id="viewer">
      <div class="empty" id="emptyState">
        <div>No visualization selected</div>
        <div class="hint">Choose a run, step, and episode from the sidebar</div>
      </div>
      <div class="loading" id="loading">Loading visualization...</div>
      <iframe id="vizFrame" style="display:none"
              sandbox="allow-scripts allow-same-origin"></iframe>
      <pre id="textView" class="text-view" style="display:none"></pre>
    </div>
  </div>
</div>

<script>
(function() {
  // ---- State ----
  let runs = [];
  let openRuns = {};
  let selectedRun = null;
  let selectedStep = null;
  let selectedFile = null;
  let unified = false;  // set by /api/config: enables Config and Log views
  // viewMode: '3d' loads rollout_envXX.html (per step+episode);
  //           'traj' loads rollout_envXX_traj.html (per step+episode);
  //           'training' loads training_curves.html (per run, ignores step/episode);
  //           'config' renders the per-run config.json as text;
  //           'log' renders the per-run log.txt as text.
  let viewMode = '3d';

  const sidebar = document.getElementById('sidebar');
  const breadcrumb = document.getElementById('breadcrumb');
  const episodeTabs = document.getElementById('episodeTabs');
  const vizFrame = document.getElementById('vizFrame');
  const textView = document.getElementById('textView');
  const emptyState = document.getElementById('emptyState');
  const loading = document.getElementById('loading');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const viewConfigBtn = document.getElementById('viewConfigBtn');
  const viewLogBtn = document.getElementById('viewLogBtn');

  // ---- API helpers ----
  async function fetchDashboardConfig() {
    try {
      const resp = await fetch('/api/config');
      if (!resp.ok) return;
      const cfg = await resp.json();
      unified = !!cfg.unified;
      // Per-run config.json + log.txt only exist in unified mode.
      viewConfigBtn.hidden = !unified;
      viewLogBtn.hidden = !unified;
    } catch (_) { /* noop */ }
  }

  async function fetchRuns() {
    const resp = await fetch('/api/runs');
    runs = await resp.json();
    renderSidebar();
  }

  async function fetchEpisodes(runName, step) {
    const resp = await fetch(`/api/runs/${encodeURIComponent(runName)}/steps/${encodeURIComponent(step)}/episodes`);
    return resp.json();
  }

  // Show one of the three viewer surfaces (iframe, pre, or empty hint).
  function showFrame() {
    emptyState.style.display = 'none';
    textView.style.display = 'none';
    vizFrame.style.display = 'block';
  }
  function showText() {
    emptyState.style.display = 'none';
    vizFrame.style.display = 'none';
    textView.style.display = 'block';
  }
  function showEmpty() {
    vizFrame.style.display = 'none';
    textView.style.display = 'none';
    emptyState.style.display = 'flex';
  }

  // ---- Format helpers ----
  function fmtStep(n) {
    if (n === 'final') return 'final rollout';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }

  function fmtRunName(name) {
    if (name === '__default__') return 'default (legacy)';
    return name;
  }

  function parseEpisodeName(filename) {
    // "forward_slow_ep0.html" -> {profile: "forward_slow", ep: 0}
    const m = filename.match(/^(.+)_ep(\d+)\.html$/);
    if (m) return { profile: m[1], ep: parseInt(m[2]) };
    return { profile: filename.replace('.html', ''), ep: 0 };
  }

  // ---- Render sidebar ----
  function renderSidebar() {
    if (runs.length === 0) {
      sidebar.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:12px;">No runs found</div>';
      return;
    }
    let html = '';
    for (const run of runs) {
      const isOpen = openRuns[run.name];
      const isActive = selectedRun === run.name;
      html += `<div class="run-group">`;
      html += `<div class="run-header ${isActive ? 'active' : ''}" data-run="${run.name}">`;
      html += `<span class="arrow ${isOpen ? 'open' : ''}">&#9654;</span>`;
      html += `<span title="${run.name}">${fmtRunName(run.name)}</span>`;
      html += `<span class="count">${run.num_steps} steps</span>`;
      html += `</div>`;
      html += `<div class="step-list ${isOpen ? 'open' : ''}">`;
      for (const step of run.steps) {
        const active = selectedRun === run.name && selectedStep === step;
        const isFinal = step === 'final';
        const cls = `step-item ${active ? 'active' : ''}${isFinal ? ' final-step' : ''}`;
        html += `<div class="${cls}" data-run="${run.name}" data-step="${step}">`;
        const label = isFinal ? 'final rollout' : `step ${fmtStep(step)}`;
        html += `<span class="step-label">${label}</span>`;
        html += `</div>`;
      }
      html += `</div></div>`;
    }
    sidebar.innerHTML = html;

    // Bind events
    sidebar.querySelectorAll('.run-header').forEach(el => {
      el.addEventListener('click', () => {
        const name = el.dataset.run;
        openRuns[name] = !openRuns[name];
        // Run-level views (training/config/log) also use the run header as
        // a "select run" gesture, since step/episode selection is irrelevant.
        if (viewMode === 'training' || viewMode === 'config' || viewMode === 'log') {
          selectedRun = name;
          loadRunLevelView(viewMode, name);
        }
        renderSidebar();
      });
    });
    sidebar.querySelectorAll('.step-item').forEach(el => {
      el.addEventListener('click', () => {
        const raw = el.dataset.step;
        // 'final' stays a string; numeric steps become ints (so equality
        // checks against the int keys returned by /api/runs work).
        const step = raw === 'final' ? 'final' : parseInt(raw);
        selectStep(el.dataset.run, step);
      });
    });
  }

  // ---- Select step -> load episodes ----
  async function selectStep(runName, step) {
    selectedRun = runName;
    selectedStep = step;
    openRuns[runName] = true;
    renderSidebar();

    // Clicking a step while in a run-level view (training/config/log) jumps
    // back to 3D so the per-step selection is meaningful again.
    if (viewMode === 'training' || viewMode === 'config' || viewMode === 'log') {
      setActiveViewButton('3d');
      viewMode = '3d';
    }

    const episodes = await fetchEpisodes(runName, step);
    renderEpisodes(episodes, runName, step);

    // Auto-select first episode
    if (episodes.length > 0) {
      selectEpisode(runName, step, episodes[0]);
    }
  }

  // ---- Run-level views: training curves / config.json / log.txt ----
  function loadRunLevelView(view, runName) {
    if (!runName) {
      const label = view === 'training' ? 'training curves'
                  : view === 'config'   ? 'config.json'
                  : view === 'log'      ? 'log.txt'
                  : view;
      breadcrumb.innerHTML = `<span style="color:var(--text-dim);">Select a run from the sidebar to view ${label}</span>`;
      showEmpty();
      return;
    }
    if (view === 'training') {
      loadTrainingCurves(runName);
    } else if (view === 'config') {
      loadConfig(runName);
    } else if (view === 'log') {
      loadLog(runName);
    }
  }

  function loadTrainingCurves(runName) {
    breadcrumb.innerHTML = `<span>${fmtRunName(runName)}</span> / <span style="color:var(--accent);">training curves</span>`;
    episodeTabs.innerHTML = '';
    const filePath = `${runName}/training_curves.html`;
    showFrame();
    loading.classList.add('show');
    // Cache-bust: training_curves.html is rewritten each eval, and browsers
    // will skip refetching an iframe whose src string is byte-identical, so
    // append ?t=now to force a reload even if the URL would otherwise match.
    vizFrame.src = '/api/files/' + encodeURI(filePath) + '?t=' + Date.now();
    vizFrame.onload = () => loading.classList.remove('show');
  }

  async function loadConfig(runName) {
    breadcrumb.innerHTML = `<span>${fmtRunName(runName)}</span> / <span style="color:var(--accent);">config.json</span>`;
    episodeTabs.innerHTML = '';
    showText();
    textView.textContent = 'Loading config...';
    try {
      const resp = await fetch(`/api/runs/${encodeURIComponent(runName)}/config`);
      if (!resp.ok) {
        textView.textContent = `(no config.json available — HTTP ${resp.status})`;
        return;
      }
      const cfg = await resp.json();
      textView.textContent = JSON.stringify(cfg, null, 2);
    } catch (e) {
      textView.textContent = `(failed to load config: ${e})`;
    }
  }

  async function loadLog(runName) {
    breadcrumb.innerHTML = `<span>${fmtRunName(runName)}</span> / <span style="color:var(--accent);">log.txt</span> <span style="color:var(--text-dim);">(last 2000 lines)</span>`;
    episodeTabs.innerHTML = '';
    showText();
    textView.textContent = 'Loading log...';
    try {
      const resp = await fetch(`/api/runs/${encodeURIComponent(runName)}/log?tail=2000&t=${Date.now()}`);
      if (!resp.ok) {
        textView.textContent = `(no log.txt available — HTTP ${resp.status})`;
        return;
      }
      const txt = await resp.text();
      textView.textContent = txt;
      // Auto-scroll to bottom so the most recent output is visible.
      textView.scrollTop = textView.scrollHeight;
    } catch (e) {
      textView.textContent = `(failed to load log: ${e})`;
    }
  }

  function setActiveViewButton(view) {
    viewToggleEl.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', b.dataset.view === view));
  }

  function renderEpisodes(episodes, runName, step) {
    const stepLabel = step === 'final' ? 'final rollout' : `step ${fmtStep(step)}`;
    breadcrumb.innerHTML = `<span>${fmtRunName(runName)}</span> / <span>${stepLabel}</span>`;
    episodeTabs.innerHTML = '';
    for (const ep of episodes) {
      // Skip _traj.html companions — they're alternate views of the matching
      // rollout_env*.html, surfaced via the View toggle, not as separate tabs.
      if (ep.endsWith('_traj.html')) continue;
      const info = parseEpisodeName(ep);
      const tab = document.createElement('div');
      tab.className = 'episode-tab' + (ep === selectedFile ? ' active' : '');
      tab.textContent = info.profile + ' #' + info.ep;
      tab.addEventListener('click', () => selectEpisode(runName, step, ep));
      episodeTabs.appendChild(tab);
    }
  }

  function selectEpisode(runName, step, filename) {
    selectedFile = filename;
    // Update active tab
    episodeTabs.querySelectorAll('.episode-tab').forEach(t => t.classList.remove('active'));
    const info = parseEpisodeName(filename);
    episodeTabs.querySelectorAll('.episode-tab').forEach(t => {
      if (t.textContent === info.profile + ' #' + info.ep) t.classList.add('active');
    });

    // Build file path. In 'traj' mode, swap the .html extension for _traj.html
    // so that rollout_env00.html becomes rollout_env00_traj.html.
    let resolvedFilename = filename;
    if (viewMode === 'traj' && filename.endsWith('.html')) {
      resolvedFilename = filename.replace(/\.html$/, '_traj.html');
    }

    // step segment: numeric → "step_N", or the special "final" subdir.
    const stepSegment = step === 'final' ? 'final' : `step_${step}`;
    let filePath;
    if (runName === '__default__') {
      filePath = `${stepSegment}/${resolvedFilename}`;
    } else {
      filePath = `${runName}/${stepSegment}/${resolvedFilename}`;
    }

    showFrame();
    loading.classList.add('show');
    vizFrame.src = '/api/files/' + encodeURI(filePath);
    vizFrame.onload = () => loading.classList.remove('show');
  }

  // ---- SSE live updates ----
  function connectSSE() {
    const es = new EventSource('/api/events');
    es.onopen = () => {
      statusDot.classList.add('live');
      statusText.textContent = 'Live';
    };
    es.onmessage = (evt) => {
      // Refresh runs list on any new file event
      fetchRuns();
      // Run-level views are rewritten in place during training — refresh
      // the iframe / text view so newly-written content shows up.
      if (selectedRun && (viewMode === 'training' || viewMode === 'config' || viewMode === 'log')) {
        loadRunLevelView(viewMode, selectedRun);
      }
    };
    es.onerror = () => {
      statusDot.classList.remove('live');
      statusText.textContent = 'Reconnecting...';
    };
  }

  // ---- View-mode toggle (3D viewer ↔ trajectory plots ↔ training curves) ----
  const viewToggleEl = document.getElementById('viewToggle');
  viewToggleEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      viewMode = btn.dataset.view;
      viewToggleEl.querySelectorAll('button').forEach(b =>
        b.classList.toggle('active', b === btn));

      if (viewMode === 'training' || viewMode === 'config' || viewMode === 'log') {
        // Run-level views ignore step/episode. Use the currently selected
        // run, or the first run in the list, or show a hint.
        const runForView = selectedRun || (runs.length > 0 ? runs[0].name : null);
        if (runForView && !selectedRun) selectedRun = runForView;
        loadRunLevelView(viewMode, runForView);
        return;
      }

      // Re-load the currently selected episode under the new view mode.
      if (selectedRun !== null && selectedStep !== null && selectedFile !== null) {
        selectEpisode(selectedRun, selectedStep, selectedFile);
      }
    });
  });

  // ---- Fullscreen toggle ----
  const appEl = document.getElementById('app');
  const fsBtn = document.getElementById('fullscreenBtn');
  const exitFsBtn = document.getElementById('exitFsBtn');
  function setFullscreen(on) {
    appEl.classList.toggle('fullscreen', on);
  }
  fsBtn.addEventListener('click', () => setFullscreen(true));
  exitFsBtn.addEventListener('click', () => setFullscreen(false));
  document.addEventListener('keydown', (e) => {
    // Ignore key events from inside the iframe / form fields
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'f' || e.key === 'F') {
      setFullscreen(!appEl.classList.contains('fullscreen'));
    } else if (e.key === 'Escape' && appEl.classList.contains('fullscreen')) {
      setFullscreen(false);
    }
  });

  // ---- Resizable sidebar ----
  (function initSidebarResize() {
    const handle = document.getElementById('sidebarResize');
    const app = document.querySelector('.app');
    let dragging = false;
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      dragging = true;
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const w = Math.max(160, Math.min(e.clientX, window.innerWidth - 200));
      document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  })();

  // ---- Init ----
  fetchDashboardConfig()
