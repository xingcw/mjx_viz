<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mjx_viz Dashboard</title>
<style>
  :root {
    --sidebar-w: 280px;
    --bg: #0f1117;
    --surface: #181b24;
    --surface-hover: #1f2330;
    --border: #2a2e3a;
    --text: #e0e0e6;
    --text-dim: #8b8fa3;
    --accent: #6c8cff;
    --accent-dim: #3d5299;
    --green: #4caf82;
    --badge: #ff6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
         background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  /* Layout */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr;
         grid-template-rows: 48px 1fr; height: 100vh; }
  .header { grid-column: 1 / -1; display: flex; align-items: center;
            padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
            gap: 12px; }
  .header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: var(--text-dim); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--badge); }
  .status-dot.live { background: var(--green); }

  /* Sidebar */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border);
             overflow-y: auto; padding: 8px 0; }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .run-group { margin-bottom: 4px; }
  .run-header { display: flex; align-items: center; padding: 8px 12px; cursor: pointer;
                font-size: 13px; font-weight: 600; color: var(--text-dim);
                transition: background 0.15s; user-select: none; gap: 6px; }
  .run-header:hover { background: var(--surface-hover); color: var(--text); }
  .run-header.active { color: var(--accent); }
  .run-header .arrow { font-size: 10px; transition: transform 0.2s; width: 12px; }
  .run-header .arrow.open { transform: rotate(90deg); }
  .run-header .count { margin-left: auto; font-size: 11px; font-weight: 400;
                       background: var(--border); padding: 1px 6px; border-radius: 8px; }
  .run-header .badge-new { margin-left: 4px; font-size: 10px; font-weight: 700;
                           color: var(--badge); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .step-list { display: none; }
  .step-list.open { display: block; }
  .step-item { padding: 6px 12px 6px 30px; font-size: 12px; cursor: pointer;
               color: var(--text-dim); transition: all 0.15s; }
  .step-item:hover { background: var(--surface-hover); color: var(--text); }
  .step-item.active { color: var(--accent); background: rgba(108, 140, 255, 0.08); }
  .step-item .step-label { font-family: monospace; }

  /* Main content */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { display: flex; align-items: center; padding: 8px 16px;
             background: var(--surface); border-bottom: 1px solid var(--border);
             gap: 8px; flex-wrap: wrap; min-height: 44px; }
  .toolbar .breadcrumb { font-size: 12px; color: var(--text-dim); }
  .toolbar .breadcrumb span { color: var(--text); }
  .toolbar .meta-chip { font-size: 11px; color: var(--text-dim);
                        background: var(--bg); border: 1px solid var(--border);
                        padding: 2px 8px; border-radius: 4px; font-family: monospace; }
  .toolbar .meta-chip b { color: var(--text); font-weight: 600; }
  .episode-tabs { display: flex; gap: 4px; margin-left: 16px; flex-wrap: wrap; }
  .episode-tab { padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;
                 background: var(--bg); border: 1px solid var(--border); color: var(--text-dim);
                 transition: all 0.15s; font-family: monospace; }
  .episode-tab:hover { border-color: var(--accent-dim); color: var(--text); }
  .episode-tab.active { background: var(--accent-dim); border-color: var(--accent);
                        color: #fff; }

  .viewer { flex: 1; position: relative; background: var(--bg); overflow: auto; }
  .viewer iframe { width: 100%; height: 100%; border: none; }
  .viewer img { max-width: calc(100% - 32px); max-height: calc(100% - 32px);
                width: auto; height: auto; display: block;
                position: absolute; top: 50%; left: 50%;
                transform: translate(-50%, -50%);
                box-shadow: 0 4px 20px rgba(0,0,0,0.35); }
  .viewer .empty { position: absolute; inset: 0; display: flex; align-items: center;
                   justify-content: center; color: var(--text-dim); font-size: 14px;
                   flex-direction: column; gap: 8px; }
  .viewer .empty .hint { font-size: 12px; }
  .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
             color: var(--text-dim); font-size: 13px; display: none; }
  .loading.show { display: block; }

  /* Sidebar "Plots" section */
  .sidebar-section-title { padding: 10px 12px 4px; font-size: 11px;
                           text-transform: uppercase; letter-spacing: 0.8px;
                           color: var(--text-dim); font-weight: 700; }
  .plot-item { padding: 6px 12px 6px 30px; font-size: 12px; cursor: pointer;
               color: var(--text-dim); transition: all 0.15s; font-family: monospace; }
  .plot-item:hover { background: var(--surface-hover); color: var(--text); }
  .plot-item.active { color: var(--accent); background: rgba(108, 140, 255, 0.08); }

  /* Toolbar "Summary" button + JSON panel */
  .toolbar button.summary-btn { margin-left: auto; font-size: 11px;
                                padding: 4px 10px; background: var(--bg);
                                color: var(--text-dim); border: 1px solid var(--border);
                                border-radius: 4px; cursor: pointer; font-family: inherit; }
  .toolbar button.summary-btn:hover { border-color: var(--accent-dim); color: var(--text); }
  .toolbar button.summary-btn.active { background: var(--accent-dim); color: #fff;
                                        border-color: var(--accent); }
  .summary-panel { display: none; max-height: 40%; overflow: auto;
                   background: var(--surface); border-top: 1px solid var(--border);
                   padding: 12px 16px; }
  .summary-panel.open { display: block; }
  .summary-panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
                      color: var(--text-dim); margin-bottom: 6px; font-weight: 700; }
  .summary-panel pre { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
                       color: var(--text); background: var(--bg);
                       border: 1px solid var(--border); border-radius: 4px;
                       padding: 8px 10px; white-space: pre-wrap;
                       word-break: break-word; margin-bottom: 10px; }
  .summary-panel .empty-text { color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>MJX_VIZ DASHBOARD</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div style="padding: 12px; color: var(--text-dim); font-size: 12px;">Loading runs...</div>
  </div>

  <div class="main">
    <div class="toolbar" id="toolbar">
      <div class="breadcrumb" id="breadcrumb">Select a run and step from the sidebar</div>
      <div class="episode-tabs" id="episodeTabs"></div>
      <button class="summary-btn" id="summaryBtn" style="display:none">Summary</button>
    </div>
    <div class="viewer" id="viewer">
      <div class="empty" id="emptyState">
        <div>No visualization selected</div>
        <div class="hint">Choose a run, step, and episode from the sidebar</div>
      </div>
      <div class="loading" id="loading">Loading visualization...</div>
      <iframe id="vizFrame" style="display:none"
              sandbox="allow-scripts allow-same-origin"></iframe>
      <img id="vizImage" style="display:none" alt="plot">
    </div>
    <div class="summary-panel" id="summaryPanel"></div>
  </div>
</div>

<script>
(function() {
  // ---- State ----
  let runs = [];
  let plots = [];
  let openRuns = {};
  let selectedRun = null;
  let selectedStep = null;
  let selectedFile = null;
  let selectedPlot = null;
  let summaryOpen = false;

  const sidebar = document.getElementById('sidebar');
  const breadcrumb = document.getElementById('breadcrumb');
  const episodeTabs = document.getElementById('episodeTabs');
  const vizFrame = document.getElementById('vizFrame');
  const vizImage = document.getElementById('vizImage');
  const emptyState = document.getElementById('emptyState');
  const loading = document.getElementById('loading');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const summaryBtn = document.getElementById('summaryBtn');
  const summaryPanel = document.getElementById('summaryPanel');

  // ---- API helpers ----
  async function fetchRuns() {
    const [runsResp, plotsResp] = await Promise.all([
      fetch('/api/runs'),
      fetch('/api/plots'),
    ]);
    runs = await runsResp.json();
    plots = plotsResp.ok ? await plotsResp.json() : [];
    renderSidebar();
  }

  async function fetchEpisodes(runName, step) {
    const resp = await fetch(`/api/runs/${encodeURIComponent(runName)}/steps/${step}/episodes`);
    return resp.json();
  }

  async function fetchSummary(runName) {
    const resp = await fetch(`/api/runs/${encodeURIComponent(runName)}/summary`);
    if (!resp.ok) return {};
    return resp.json();
  }

  // ---- Format helpers ----
  function fmtStep(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(n);
  }

  function fmtRunName(name) {
    if (name === '__default__') return 'default (legacy)';
    return name;
  }

  function parseEpisodeName(filename) {
    // "forward_slow_ep0.html" -> {profile: "forward_slow", ep: 0}
    const m = filename.match(/^(.+)_ep(\d+)\.html$/);
    if (m) return { profile: m[1], ep: parseInt(m[2]) };
    return { profile: filename.replace('.html', ''), ep: 0 };
  }

  // ---- Render sidebar ----
  function renderSidebar() {
    if (runs.length === 0 && plots.length === 0) {
      sidebar.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:12px;">No runs found</div>';
      return;
    }
    let html = '';
    if (plots.length > 0) {
      html += `<div class="sidebar-section-title">Plots</div>`;
      for (const plot of plots) {
        const active = selectedPlot === plot;
        html += `<div class="plot-item ${active ? 'active' : ''}" data-plot="${plot}">`;
        html += `<span>${plot}</span></div>`;
      }
    }
    if (runs.length > 0) {
      html += `<div class="sidebar-section-title">Runs</div>`;
    }
    for (const run of runs) {
      const isOpen = openRuns[run.name];
      const isActive = selectedRun === run.name;
      const isViz = run.layout === 'viz';
      html += `<div class="run-group">`;
      html += `<div class="run-header ${isActive ? 'active' : ''}" data-run="${run.name}" data-viz="${isViz ? '1' : '0'}">`;
      html += `<span class="arrow ${(isOpen || isViz) ? 'open' : ''}" style="${isViz ? 'visibility:hidden' : ''}">&#9654;</span>`;
      html += `<span title="${run.name}">${fmtRunName(run.name)}</span>`;
      if (!isViz) {
        html += `<span class="count">${run.num_steps} steps</span>`;
      }
      html += `</div>`;
      if (!isViz) {
        html += `<div class="step-list ${isOpen ? 'open' : ''}">`;
        for (const step of run.steps) {
          const active = selectedRun === run.name && selectedStep === step;
          html += `<div class="step-item ${active ? 'active' : ''}" data-run="${run.name}" data-step="${step}">`;
          html += `<span class="step-label">step ${fmtStep(step)}</span>`;
          html += `</div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
    sidebar.innerHTML = html;

    // Bind events
    sidebar.querySelectorAll('.run-header').forEach(el => {
      el.addEventListener('click', () => {
        const name = el.dataset.run;
        if (el.dataset.viz === '1') {
          // viz-layout runs have a synthetic step 0 — select directly
          selectStep(name, 0);
        } else {
          openRuns[name] = !openRuns[name];
          renderSidebar();
        }
      });
    });
    sidebar.querySelectorAll('.step-item').forEach(el => {
      el.addEventListener('click', () => selectStep(el.dataset.run, parseInt(el.dataset.step)));
    });
    sidebar.querySelectorAll('.plot-item').forEach(el => {
      el.addEventListener('click', () => selectPlot(el.dataset.plot));
    });
  }

  function selectPlot(name) {
    selectedPlot = name;
    selectedRun = null;
    selectedStep = null;
    selectedFile = null;
    renderSidebar();
    // Hide iframe, show image; hide summary button (plots aren't runs)
    vizFrame.style.display = 'none';
    emptyState.style.display = 'none';
    summaryBtn.style.display = 'none';
    summaryPanel.classList.remove('open');
    summaryOpen = false;
    breadcrumb.innerHTML = `<span>Plots</span> / <span>${name}</span>`;
    episodeTabs.innerHTML = '';
    vizImage.style.display = 'block';
    vizImage.src = '/api/files/' + encodeURI(name);
  }

  function findRun(name) {
    return runs.find(r => r.name === name);
  }

  function renderMetaChips(run) {
    if (!run || !run.meta) return '';
    const chips = [];
    const scales = run.meta.morphology_scales;
    if (scales && typeof scales === 'object') {
      for (const [k, v] of Object.entries(scales)) {
        const val = typeof v === 'number' ? v.toFixed(3) : String(v);
        chips.push(`<span class="meta-chip"><b>${k}</b> ${val}</span>`);
      }
    }
    if (run.meta.env_name) {
      chips.unshift(`<span class="meta-chip"><b>env</b> ${run.meta.env_name}</span>`);
    }
    return chips.join(' ');
  }

  // ---- Select step -> load episodes ----
  async function selectStep(runName, step) {
    selectedRun = runName;
    selectedStep = step;
    openRuns[runName] = true;
    renderSidebar();

    const episodes = await fetchEpisodes(runName, step);
    renderEpisodes(episodes, runName, step);

    // Auto-select first episode
    if (episodes.length > 0) {
      selectEpisode(runName, step, episodes[0]);
    }
  }

  function renderEpisodes(episodes, runName, step) {
    const run = findRun(runName);
    const isViz = run && run.layout === 'viz';
    const crumb = isViz
      ? `<span>${fmtRunName(runName)}</span>`
      : `<span>${fmtRunName(runName)}</span> / <span>step ${fmtStep(step)}</span>`;
    const chips = renderMetaChips(run);
    breadcrumb.innerHTML = chips ? `${crumb} &nbsp; ${chips}` : crumb;
    episodeTabs.innerHTML = '';
    for (const ep of episodes) {
      const info = parseEpisodeName(ep);
      const tab = document.createElement('div');
      tab.className = 'episode-tab' + (ep === selectedFile ? ' active' : '');
      tab.textContent = info.profile + ' #' + info.ep;
      tab.addEventListener('click', () => selectEpisode(runName, step, ep));
      episodeTabs.appendChild(tab);
    }
  }

  function selectEpisode(runName, step, filename) {
    selectedFile = filename;
    // Update active tab
    episodeTabs.querySelectorAll('.episode-tab').forEach(t => t.classList.remove('active'));
    const info = parseEpisodeName(filename);
    episodeTabs.querySelectorAll('.episode-tab').forEach(t => {
      if (t.textContent === info.profile + ' #' + info.ep) t.classList.add('active');
    });

    // Build file path
    const run = findRun(runName);
    let filePath;
    if (runName === '__default__') {
      filePath = `step_${step}/${filename}`;
    } else if (run && run.layout === 'viz') {
      filePath = `${runName}/viz/${filename}`;
    } else {
      filePath = `${runName}/step_${step}/${filename}`;
    }

    emptyState.style.display = 'none';
    vizImage.style.display = 'none';
    loading.classList.add('show');
    vizFrame.style.display = 'block';
    vizFrame.src = '/api/files/' + encodeURI(filePath);
    vizFrame.onload = () => loading.classList.remove('show');

    // Show the Summary button (hidden for plots/legacy layouts without a run name)
    summaryBtn.style.display = runName && runName !== '__default__' ? 'inline-block' : 'none';
    // If the panel was open for a different run, refresh its content
    if (summaryOpen) renderSummaryPanel(runName);
  }

  async function renderSummaryPanel(runName) {
    const data = await fetchSummary(runName);
    const parts = [];
    if (data.metadata) {
      parts.push(`<h3>morphology_metadata.json</h3>`);
      parts.push(`<pre>${escapeHtml(JSON.stringify(data.metadata, null, 2))}</pre>`);
    }
    if (data.rollout_summary) {
      parts.push(`<h3>rollout_summary.json (first ${data.rollout_summary.length} episodes)</h3>`);
      parts.push(`<pre>${escapeHtml(JSON.stringify(data.rollout_summary, null, 2))}</pre>`);
    }
    if (!parts.length) {
      parts.push(`<div class="empty-text">No summary JSONs found for ${escapeHtml(runName)}.</div>`);
    }
    summaryPanel.innerHTML = parts.join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  }

  summaryBtn.addEventListener('click', () => {
    summaryOpen = !summaryOpen;
    summaryBtn.classList.toggle('active', summaryOpen);
    summaryPanel.classList.toggle('open', summaryOpen);
    if (summaryOpen && selectedRun) renderSummaryPanel(selectedRun);
  });

  // ---- SSE live updates ----
  function connectSSE() {
    const es = new EventSource('/api/events');
    es.onopen = () => {
      statusDot.classList.add('live');
      statusText.textContent = 'Live';
    };
    es.onmessage = (evt) => {
      // Refresh runs list on any new file event
      fetchRuns();
    };
    es.onerror = () => {
      statusDot.classList.remove('live');
      statusText.textContent = 'Reconnecting...';
    };
  }

  // ---- Init ----
  fetchRuns().then(connectSSE);
})();
</script>
</body>
</html>
